version: "3.9"

# ── Optional infrastructure for advanced deployments ──────────────
# For the MVP, these services are NOT required.
# Redis is used for rate limiting and distributed locks.
# RabbitMQ is used for durable async job processing.
#
# Usage: docker compose up -d

services:
  redis:
    image: redis:7-alpine
    container_name: vibe2verse-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: vibe2verse-rabbitmq
    restart: unless-stopped
    ports:
      - "5672:5672"    # AMQP protocol
      - "15672:15672"  # Management UI (http://localhost:15672)
    environment:
      RABBITMQ_DEFAULT_USER: vibe2verse
      RABBITMQ_DEFAULT_PASS: vibe2verse_dev
      RABBITMQ_DEFAULT_VHOST: vibe2verse
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 5

volumes:
  redis_data:
  rabbitmq_data:
